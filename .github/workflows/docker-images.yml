# Baut beide Images und veröffentlicht sie in der GitHub Container Registry
# (ghcr.io/<besitzer>/ready2race-backend und ...-web). Ein Server braucht dann
# nur noch `docker compose pull`, kein JDK, kein Node, keinen Bau vor Ort.
#
# Tags: `latest` für main, die Versionsnummer für Git-Tags wie v1.2.3, dazu der
# Commit-Hash. Pull-Requests bauen nur, ohne zu veröffentlichen.

name: Docker-Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: web
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Bei ghcr.io anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags ableiten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ready2race-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # Server laufen fast immer auf amd64. Für arm64 (z. B. Raspberry Pi
          # oder Ampere-VMs) `linux/arm64` ergänzen, dann baut das Backend
          # allerdings unter QEMU und braucht ein Vielfaches der Zeit.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
